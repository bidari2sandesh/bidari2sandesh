      <circle cx="638" cy="55" r="18" fill="#ffffff" fill-opacity="0.18" />
      <text x="638" y="60" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5</text>
      <text x="666" y="53" fill="#ffffff" font-size="17" font-weight="700">HTML</text>
