<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="110" viewBox="0 0 1200 110" role="img" aria-labelledby="title desc">
  <title id="title">Tech stack</title>
  <desc id="desc">Six colorful technology cards for Python, Django, JavaScript, HTML, CSS, and PostgreSQL.</desc>
